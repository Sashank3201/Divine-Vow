<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Divine Vow</title>
    <meta name="description" content="A private sanctuary for breaking free from the habit that holds you back. Watch two galaxies collide and become something new — then make your vow." />
    <meta name="theme-color" content="#04050d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Divine Vow" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta property="og:title" content="Divine Vow" />
    <meta property="og:description" content="Two galaxies collide. A new one is born. Make your vow." />
    <style>
      /* Critical: paint deep space instantly, before any JS or CSS loads. */
      html, body { background: #03040b; margin: 0; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(ellipse at 50% 45%, #0d0f26 0%, #03040b 65%);
        transition: opacity 0.9s ease;
      }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot svg { width: 64px; height: 64px; animation: boot-spin 6s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none">
        <ellipse cx="20" cy="20" rx="17" ry="7" transform="rotate(-30 20 20)" stroke="#f4c97c" stroke-width="1.2" opacity="0.8" />
        <ellipse cx="20" cy="20" rx="17" ry="7" transform="rotate(30 20 20)" stroke="#f4c97c" stroke-width="1.2" opacity="0.8" />
        <path d="M20 11.5c.6 4.4 3.6 7.4 8 8-4.4.6-7.4 3.6-8 8-.6-4.4-3.6-7.4-8-8 4.4-.6 7.4-3.6 8-8Z" fill="#f4c97c" />
      </svg>
    </div>
    <canvas id="cosmos" aria-label="Simulation of the Milky Way and Andromeda galaxies colliding" role="img"></canvas>
    <div id="veil" aria-hidden="true"></div>
    <div id="dim" aria-hidden="true"></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="app">
      <main id="view"></main>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
    <noscript>
      <p style="color:#fff;font-family:system-ui;padding:24px">Divine Vow needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
