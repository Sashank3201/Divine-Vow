<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Divine Vow</title>
    <meta name="description" content="Quit the habit that’s holding you back. A private streak tracker and urge toolkit over a live simulation of the Milky Way and Andromeda colliding." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Divine Vow" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta property="og:title" content="Divine Vow" />
    <meta property="og:description" content="Quit the habit that’s holding you back. One day at a time." />
    <style>
      /* Paint black instantly, before any JS or CSS loads. */
      html, body { background: #000; margin: 0; }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #000; }
      #boot span {
        width: 6px; height: 6px; border-radius: 50%; background: #fff;
        box-shadow: 0 0 18px 4px rgba(143, 211, 255, 0.35);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse { 50% { transform: scale(1.8); opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span></span></div>
    <canvas id="cosmos" aria-label="Simulation of the Milky Way and Andromeda galaxies colliding" role="img"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <main id="view"></main>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
    <noscript>
      <p style="color:#fff;font-family:system-ui;padding:24px">Divine Vow needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
